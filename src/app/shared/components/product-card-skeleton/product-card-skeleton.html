<article class="card-skeleton" aria-hidden="true">
  <div class="card-skeleton__media">
    <app-skeleton width="100%" height="100%" radius="0" />
  </div>

  <div class="card-skeleton__body">
    <app-skeleton class="card-skeleton__category" width="34%" height="13px" />
    <app-skeleton class="card-skeleton__title" width="74%" height="22px" />

    <div class="card-skeleton__lines">
      <app-skeleton width="96%" height="13px" />
      <app-skeleton width="64%" height="13px" />
    </div>

    <app-skeleton class="card-skeleton__rating" width="38%" height="14px" />

    <div class="card-skeleton__footer">
      <div class="card-skeleton__price">
        <app-skeleton width="66px" height="25px" />
        <app-skeleton width="44px" height="15px" />
      </div>
      <app-skeleton class="card-skeleton__add" width="95px" height="38px" radius="8px" />
    </div>
  </div>
</article>
