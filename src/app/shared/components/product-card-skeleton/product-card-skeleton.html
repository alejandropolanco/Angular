<article class="card-skeleton" aria-hidden="true">
  <div class="card-skeleton__media">
    <app-skeleton width="100%" height="100%" radius="0" />
  </div>

  <div class="card-skeleton__body">
    <app-skeleton class="card-skeleton__category" width="38%" height="14px" radius="0" />
    <app-skeleton class="card-skeleton__title" width="78%" height="42.5px" radius="0" />

    <div class="card-skeleton__lines">
      <app-skeleton width="96%" height="15.5px" radius="0" />
      <app-skeleton width="64%" height="15.5px" radius="0" />
    </div>

    <app-skeleton class="card-skeleton__rating" width="38%" height="16px" radius="0" />

    <div class="card-skeleton__footer">
      <div class="card-skeleton__price">
        <app-skeleton width="72px" height="22px" radius="0" />
        <app-skeleton width="48px" height="12px" radius="0" />
      </div>
      <app-skeleton width="100%" height="44px" radius="0" />
    </div>
  </div>
</article>
