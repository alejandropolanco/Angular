<article class="card-skeleton" aria-hidden="true">
  <div class="card-skeleton__media">
    <app-skeleton width="100%" height="100%" radius="0" />
  </div>

  <div class="card-skeleton__body">
    <app-skeleton width="34%" height="10px" radius="999px" />
    <app-skeleton class="card-skeleton__title" width="74%" height="19px" />
    <app-skeleton class="card-skeleton__line" width="96%" height="12px" />
    <app-skeleton class="card-skeleton__line" width="64%" height="12px" />
    <app-skeleton class="card-skeleton__rating" width="38%" height="12px" />

    <div class="card-skeleton__footer">
      <div class="card-skeleton__price">
        <app-skeleton width="66px" height="22px" />
        <app-skeleton width="44px" height="12px" />
      </div>
      <app-skeleton width="98px" height="38px" radius="11px" />
    </div>
  </div>
</article>
