
<h2>🛒 Carrito de compras</h2>

<p-table [value]="cartService.cartItems()">

  <ng-template pTemplate="header">
    <tr>
      <th>Producto</th>
      <th>Precio</th>
      <th>Cantidad</th>
      <th>Total</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-item>
    <tr>

      <td>
        <img
           [src]="'images/' + item.image" [alt]="item.name" width="200" 
        />
        {{ item.name }}
      </td>

      <td>${{ item.price }}</td>

      <td>{{ item.quantity }}</td>

      <td>
        ${{ item.price * item.quantity }}
      </td>

      <td>
        <p-button
          icon="pi pi-trash"
          severity="danger"
          (onClick)="cartService.removeFromCart(item.id)"
        ></p-button>
      </td>

    </tr>
  </ng-template>

</p-table>

<hr>

<h3>Total: ${{ cartService.totalPrice() }}</h3>

<p-button
  label="Vaciar carrito"
  severity="danger"
  (onClick)="cartService.clearCart()"
></p-button>
