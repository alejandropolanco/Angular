# Blueprint de Render para NovaStore (Angular SSR + API Express + SQLite).
#
# Un único servicio Node sirve la web y la API (`/api`). La base SQLite vive en
# un archivo dentro del proyecto.
#
# ⚠️ MODO FREE: el filesystem de Render free es EFÍMERO. Usuarios, sesiones,
# productos y pedidos se borran en cada deploy/reinicio. Sirve para demo.
# Para persistencia real, ver el bloque `disk` comentado abajo (requiere plan
# pago) o `docs/deploy.md` §10 (VM gratis con disco).
#
# Uso: Render -> New -> Blueprint -> elegí este repositorio.
# Docs: docs/deploy.md
#
# Ajustá `name` (define el dominio por defecto `<name>.onrender.com`) y las
# variables marcadas abajo antes de aplicar.

services:
  - type: web
    name: novastore
    runtime: node
    # Free: 512 MB, se suspende a los 15 min sin tráfico y no admite discos.
    # Si el SSR queda corto de memoria o querés persistencia, subí a `0.5c-512mb`.
    plan: free
    region: oregon # Cambiá a la región más cercana (ohio, virginia, frankfurt, singapore).
    # `--include=dev` es imprescindible: con NODE_ENV=production npm omite las
    # devDependencies, y el CLI de Angular (`ng`) es una de ellas.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/shop-tex/server/server.mjs
    healthCheckPath: /
    autoDeployTrigger: commit # Deploy automático en cada push a la rama.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24' # Coincidí con la versión de Node usada en desarrollo.
      # Relativa a la raíz del proyecto: escribible en Render free. El contenido
      # es efímero (se pierde en cada deploy/reinicio).
      - key: DATABASE_PATH
        value: data/novastore.db
      - key: SESSION_TTL_DAYS
        value: '7'
      - key: TRUST_PROXY
        value: 'true' # Render va detrás de un proxy inverso.
      # Angular SSR: permite el host de producción (se fusiona con angular.json).
      # Ajustá al dominio real que Render asigne al servicio.
      - key: NG_ALLOWED_HOSTS
        value: novastore.onrender.com
      # Origen permitido para las solicitudes a /api (con esquema https).
      - key: ALLOWED_ORIGINS
        value: https://novastore.onrender.com
      # Credenciales del administrador inicial. `sync: false` las pide en el
      # dashboard y no las guarda en el repositorio.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

    # --- Persistencia real (requiere plan pago) --------------------------------
    # Descomentá para conservar los datos entre deploys. Requiere cambiar
    # `plan: free` por `plan: 0.5c-512mb` (o superior) y apuntar DATABASE_PATH
    # a `/var/lib/novastore/novastore.db`.
    #
    # disk:
    #   name: novastore-data
    #   mountPath: /var/lib/novastore
    #   sizeGB: 1
